<!DOCTYPE html>
<html lang="pt-BR">

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F5F3FF',

              200: '#DDD6FE',
              300: '#C4B5FD',
              400: '#A78BFA',

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #DDD6FE;
      border-radius: 4px;
    }
    .flashcard {
      perspective: 1000px;
    }
    .flashcard-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }
    .flashcard-front, .flashcard-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flashcard-back {
      transform: rotateY(180deg);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>

  <script>

       STATE MANAGEMENT & FRESH ZERO STATE
       ======================================================== */
    const STORAGE_KEY = 'sincrome_app_v7_faithful';

    const freshZeroState = {
      onboardingDone: false,
      onboardingStep: 1,
      tempOnboarding: {
        name: '',
        course: '',
        institution: '',
        semester: '1º Semestre',
        subjects: []
      },
      user: {
        name: '',
        course: '',
        institution: '',
        semester: '',
        bio: 'Conciliando trabalho e faculdade no meu próprio ritmo!',
        avatar: '',
        xp: 0,
        xpNext: 100,
        level: 1,
        streakDays: 1,
        tasksDone: 0,
        skills: {
          organizacao: { name: 'Organização', xp: 0, max: 100, level: 1, icon: '📋' },
          foco: { name: 'Foco', xp: 0, max: 100, level: 1, icon: '🎯' },
          planejamento: { name: 'Planejamento', xp: 0, max: 100, level: 1, icon: '📅' },
          gestaoTempo: { name: 'Gestão do Tempo', xp: 0, max: 100, level: 1, icon: '⏱️' }
        }
      },
      subjects: [],
      schedule: [],
      files: [],
      simulado: {
        answered: false,
        selectedIndex: null,
        isCorrect: false

      simuladoCompleted: false, // Flag to unlock checklist item 3 on home!
      aiSettings: {
        useWebSearch: false,
        selectedSubjectId: null,
        selectedFileIds: []
      },
      offlineMaterials: []
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(freshZeroState));
      } catch (e) {
        return JSON.parse(JSON.stringify(freshZeroState));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function resetToFirstAccess() {
      if (confirm("Deseja zerar o aplicativo e voltar para a primeira tela de cadastro do aluno?")) {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(freshZeroState));
        saveState();
        renderCurrentTab();
        showToast("Aplicativo zerado! Iniciando tela 1.", "🔄");
      }
    }

    /* ========================================================
       DATE UTILITIES & 7-DAY EM BREVE CALCULATION
       ======================================================== */
    function getDaysUntil(dateStr) {
      if (!dateStr) return 999;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const target = new Date(parts[0], parts[1] - 1, parts[2]);
        const diffTime = target - today;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      }
      return 999;
    }

    function formatDateBR(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return dateStr;
    }

    /* ========================================================

       ======================================================== */

      'adm': 'Administração',

      'estatistica': 'Estatística',

      'ingles': 'Inglês',

      'etica': 'Ética',

      'rh': 'Recursos Humanos',

      'marketing': 'Marketing',
      'vendas': 'Vendas',
      'pesquisa': 'Pesquisa',
      'economia': 'Economia',

      'financeira': 'Financeira',
      'financeiro': 'Financeiro',
      'direito': 'Direito',
      'tributario': 'Tributário',
      'tributaria': 'Tributária',
      'estrategia': 'Estratégia',
      'estrategica': 'Estratégica',
      'estrategico': 'Estratégico',
      'sociedade': 'Sociedade',
      'sustentabilidade': 'Sustentabilidade',
      'ambiental': 'Ambiental',
      'comportamento': 'Comportamento',
      'consumidor': 'Consumidor',
      'servicos': 'Serviços',
      'publicidade': 'Publicidade',
      'propaganda': 'Propaganda',
      'varejo': 'Varejo',
      'operacoes': 'Operações',
      'custos': 'Custos',
      'governanca': 'Governança',
      'inovacao': 'Inovação',
      'calculo': 'Cálculo',
      'estatistico': 'Estatístico'
    };

    function autocorrectSubjectName(raw) {
      if (!raw) return '';
      const cleanInput = raw.trim();
      const words = cleanInput.split(/\s+/);
      const stopWords = ['de', 'da', 'do', 'das', 'dos', 'e', 'em', 'para', 'com', 'a', 'o'];

      const correctedWords = words.map((word, index) => {
        const normalized = word.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        let finalWord = academicDictionary[normalized];

        if (!finalWord) {
          const lower = word.toLowerCase();
          if (index > 0 && stopWords.includes(lower)) {
            finalWord = lower;
          } else {
            finalWord = lower.charAt(0).toUpperCase() + lower.slice(1);
          }
        } else if (index > 0 && stopWords.includes(word.toLowerCase())) {
          finalWord = word.toLowerCase();
        }

        return finalWord;
      });

      return correctedWords.join(' ');
    }

    /* ========================================================
       4-STEP ONBOARDING SCREENS CONTROLLER
       ======================================================== */

      const container = document.getElementById('content-container');
      const bottomNav = document.getElementById('bottom-nav');

      switch (step) {
        case 1:

              </div>

              <div class="pt-4">
                <button onclick="nextOnboardingStep(1)" class="w-full py-4 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
                  <span>Próximo Passo</span>

          break;

        case 2:
          stepContent = `

              <div class="flex items-center justify-between text-xs font-bold text-brand-600">
                <button onclick="prevOnboardingStep(2)" class="text-slate-400 hover:text-slate-700 font-semibold flex items-center gap-1">

                <span>TELA 2 DE 4</span>

                  <span class="w-2 h-1.5 rounded-full bg-slate-200"></span>
                  <span class="w-2 h-1.5 rounded-full bg-slate-200"></span>
                </div>
              </div>

                  🎓
                </div>
                <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Qual curso você faz?</h2>
                <p class="text-xs text-slate-500 max-w-xs mx-auto">
                  Prazer, <strong class="text-slate-800">${state.tempOnboarding.name}</strong>! Nos diga qual é o seu curso.

              </div>

              <div class="space-y-2 pt-2">

                  type="text"

                  class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-brand-600 focus:outline-none text-sm font-semibold transition bg-white shadow-xs"
                  onkeypress="if(event.key === 'Enter') nextOnboardingStep(2)"
                >
              </div>

              <div class="space-y-1.5">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sugestões rápidas:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${['Gestão Comercial', 'Administração Geral', 'Logística', 'Comércio Exterior', 'Análise e Desenvolvimento'].map(c => `
                    <button type="button" onclick="selectQuickCourse('${c}')" class="px-2.5 py-1 rounded-xl bg-white border border-slate-200 hover:border-brand-500 hover:text-brand-600 text-xs font-medium transition text-slate-600">

                  `).join('')}
                </div>
              </div>

              <div class="pt-2">
                <button onclick="nextOnboardingStep(2)" class="w-full py-4 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
                  <span>Próximo Passo</span>
                  <span class="text-brand-200">&rarr;</span>
                </button>
              </div>
            </div>
          `;
          break;

        case 3:
          stepContent = `
            <div class="space-y-6 pt-6 animate-fade-in">
              <div class="flex items-center justify-between text-xs font-bold text-brand-600">
                <button onclick="prevOnboardingStep(3)" class="text-slate-400 hover:text-slate-700 font-semibold flex items-center gap-1">
                  &larr; Voltar
                </button>
                <span>TELA 3 DE 4</span>
                <div class="flex gap-1.5">
                  <span class="w-2 h-1.5 rounded-full bg-brand-600"></span>
                  <span class="w-2 h-1.5 rounded-full bg-brand-600"></span>

                  value="${state.tempOnboarding.institution || ''}" 
                  placeholder="Ex: FATEC Itaquaquecetuba, USP, UNIP, Anhanguera..." 
                  class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-brand-600 focus:outline-none text-sm font-semibold transition bg-white shadow-xs"
                  onkeypress="if(event.key === 'Enter') nextOnboardingStep(3)"
                >
              </div>

              <div class="space-y-1.5">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sugestões rápidas:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${['FATEC Itaquaquecetuba', 'FATEC Mogi das Cruzes', 'FATEC Zona Leste', 'ETEC', 'IFSP'].map(inst => `
                    <button type="button" onclick="selectQuickInstitution('${inst}')" class="px-2.5 py-1 rounded-xl bg-white border border-slate-200 hover:border-brand-500 hover:text-brand-600 text-xs font-medium transition text-slate-600">
                      + ${inst}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="pt-2">
                <button onclick="nextOnboardingStep(3)" class="w-full py-4 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
                  <span>Próximo Passo</span>
                  <span class="text-brand-200">&rarr;</span>
                </button>
              </div>
            </div>
          `;
          break;

        case 4:
          stepContent = `
            <div class="space-y-4 pt-4 animate-fade-in pb-4">
              <div class="flex items-center justify-between text-xs font-bold text-brand-600">
                <button onclick="prevOnboardingStep(4)" class="text-slate-400 hover:text-slate-700 font-semibold flex items-center gap-1">
                  &larr; Voltar
                </button>
                <span>TELA 4 DE 4</span>
                <div class="flex gap-1.5">
                  <span class="w-2 h-1.5 rounded-full bg-brand-600"></span>
                  <span class="w-2 h-1.5 rounded-full bg-brand-600"></span>
                  <span class="w-2 h-1.5 rounded-full bg-brand-600"></span>
                  <span class="w-6 h-1.5 rounded-full bg-brand-600"></span>
                </div>
              </div>

              <div>
                <h2 class="text-lg font-extrabold text-slate-800 tracking-tight">Semestre & Matérias</h2>
                <p class="text-xs text-slate-500">
                  Escreva os nomes completos (corrigiremos acentos e maiúsculas sem usar siglas).
                </p>
              </div>

              <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700">Qual semestre você está cursando?</label>
                <div class="grid grid-cols-3 gap-1.5">
                  ${['1º Semestre', '2º Semestre', '3º Semestre', '4º Semestre', '5º Semestre', '6º Semestre'].map(sem => `
                    <button type="button" onclick="selectSemester('${sem}')" class="py-2 px-1 rounded-xl text-xs font-bold transition border ${state.tempOnboarding.semester === sem ? 'bg-brand-600 text-white border-brand-600 shadow-xs' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'}">
                      ${sem}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="space-y-2 pt-1">
                <label class="block text-xs font-bold text-slate-700">Digite suas matérias:</label>
                <div class="flex gap-2">
                  <input 
                    type="text" 
                    id="step4-subject-input" 
                    placeholder="Ex: gestao comercial, ingles, administracao..." 
                    class="flex-1 p-3 rounded-2xl border-2 border-slate-200 focus:border-brand-600 focus:outline-none text-xs font-semibold bg-white shadow-xs"
                    onkeypress="if(event.key === 'Enter') { event.preventDefault(); addSubjectWithSpellcheck(); }"
                  >
                  <button type="button" onclick="addSubjectWithSpellcheck()" class="px-4 py-3 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold shrink-0 shadow-sm transition">
                    + Inserir
                  </button>
                </div>
                <div id="correction-feedback" class="hidden text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 flex items-center gap-1.5">
                  <span>✨</span> <span id="correction-msg"></span>
                </div>
              </div>

              <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-slate-700">Matérias cadastradas (${state.tempOnboarding.subjects.length}):</span>
                  ${state.tempOnboarding.subjects.length > 0 ? `
                    <span class="text-[10px] text-emerald-600 font-bold">Nomes completos ✓</span>
                  ` : ''}
                </div>

                <div class="min-h-24 p-3 bg-white rounded-2xl border border-slate-200/80 shadow-xs space-y-1.5">
                  ${state.tempOnboarding.subjects.length > 0 ? `
                    <div class="flex flex-wrap gap-2">
                      ${state.tempOnboarding.subjects.map((sub, idx) => `
                        <div class="px-3 py-1.5 rounded-xl bg-brand-50 text-brand-700 border border-brand-200 text-xs font-bold flex items-center gap-2 shadow-xs">
                          <span>${sub}</span>
                          <button onclick="removeOnboardingSubject(${idx})" class="text-brand-400 hover:text-rose-500 font-black text-sm">&times;</button>
                        </div>
                      `).join('')}
                    </div>
                  ` : `
                    <div class="text-center py-4 text-slate-400 space-y-1">
                      <p class="text-xs">Nenhuma matéria adicionada ainda.</p>
                      <p class="text-[10px]">Escreva uma matéria acima e clique em "+ Inserir".</p>
                    </div>
                  `}
                </div>
              </div>

              <div class="space-y-1.5">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sugestões rápidas de Gestão Comercial:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${['Gestão de Pessoas', 'Marketing & Vendas', 'Administração Geral', 'Comunicação Empresarial', 'Inglês Aplicado', 'Logística Empresarial'].map(sub => `
                    <button type="button" onclick="addSuggestedSubject('${sub}')" class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-brand-50 hover:text-brand-600 text-xs font-medium transition text-slate-600 border border-slate-200">
                      + ${sub}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="pt-3">
                <button onclick="finishAllOnboarding()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-extrabold text-sm shadow-xl shadow-brand-500/30 transition flex items-center justify-center gap-2">
                  <span>Concluir Cadastro & Iniciar App</span>
                  <span class="text-amber-300 font-black">+50 XP 🚀</span>
                </button>
              </div>
            </div>
          `;
          break;
      }

      container.innerHTML = stepContent;
    }

    function selectQuickCourse(course) {
      document.getElementById('step2-course').value = course;
    }

    function selectQuickInstitution(inst) {
      document.getElementById('step3-institution').value = inst;
    }

    function selectSemester(sem) {
      state.tempOnboarding.semester = sem;
      renderOnboardingStep();
    }

    function addSuggestedSubject(subject) {
      if (!state.tempOnboarding.subjects.includes(subject)) {
        state.tempOnboarding.subjects.push(subject);
        showToast(`Matéria "${subject}" adicionada!`, "📚");
        renderOnboardingStep();
      }
    }

    function addSubjectWithSpellcheck() {
      const input = document.getElementById('step4-subject-input');
      const rawText = input.value.trim();

      if (!rawText) {
        showToast("Digite o nome da matéria primeiro!", "⚠️");
        return;
      }

      const formatted = autocorrectSubjectName(rawText);

      if (state.tempOnboarding.subjects.includes(formatted)) {
        showToast("Esta matéria já está na lista!", "⚠️");
        return;
      }

      state.tempOnboarding.subjects.push(formatted);
      input.value = '';

      const fb = document.getElementById('correction-feedback');
      const msg = document.getElementById('correction-msg');
      if (rawText.toLowerCase() !== formatted.toLowerCase() || rawText !== formatted) {
        msg.innerText = `Corrigido: "${rawText}" ➔ "${formatted}"`;
        fb.classList.remove('hidden');
        setTimeout(() => fb.classList.add('hidden'), 3500);
      }

      showToast(`Matéria "${formatted}" inserida com sucesso!`, "✨");
      renderOnboardingStep();
    }

    function removeOnboardingSubject(index) {
      state.tempOnboarding.subjects.splice(index, 1);
      renderOnboardingStep();
    }

    function nextOnboardingStep(current) {
      if (current === 1) {
        const name = document.getElementById('step1-name').value.trim();
        if (!name) {
          alert("Por favor, digite seu nome para continuar!");
          return;
        }
        state.tempOnboarding.name = name;
        state.onboardingStep = 2;
        saveState();
        renderOnboardingStep();
      } else if (current === 2) {
        const course = document.getElementById('step2-course').value.trim();
        if (!course) {
          alert("Por favor, digite seu curso para continuar!");
          return;
        }
        state.tempOnboarding.course = course;
        state.onboardingStep = 3;
        saveState();
        renderOnboardingStep();
      } else if (current === 3) {
        const inst = document.getElementById('step3-institution').value.trim();
        if (!inst) {
          alert("Por favor, informe onde você estuda para continuar!");
          return;
        }
        state.tempOnboarding.institution = inst;
        state.onboardingStep = 4;
        saveState();
        renderOnboardingStep();
      }
    }

    function prevOnboardingStep(current) {
      if (current > 1) {
        state.onboardingStep = current - 1;
        saveState();
        renderOnboardingStep();
      }
    }

    function finishAllOnboarding() {
      if (state.tempOnboarding.subjects.length === 0) {
        alert("Por favor, adicione pelo menos uma matéria!");
        return;
      }

      state.user.name = state.tempOnboarding.name;
      state.user.course = state.tempOnboarding.course;
      state.user.institution = state.tempOnboarding.institution;
      state.user.semester = state.tempOnboarding.semester;

      state.subjects = state.tempOnboarding.subjects.map((subName, i) => {
        const colors = [
          'from-violet-500 to-purple-600',
          'from-rose-500 to-pink-600',
          'from-blue-500 to-indigo-600',
          'from-emerald-500 to-teal-600',
          'from-amber-500 to-orange-600',
          'from-cyan-500 to-sky-600'
        ];
        const complexity = (i % 2 === 0) ? 'Alta Complexidade' : 'Média Complexidade';
        return {
          id: 'sub-user-' + i,
          name: subName,
          complexity,
          color: colors[i % colors.length]
        };
      });

      state.onboardingDone = true;
      state.user.xp = 50;
      state.user.skills.organizacao.xp = 50;

      saveState();

      const bottomNav = document.getElementById('bottom-nav');
      if (bottomNav) bottomNav.classList.remove('hidden');

      currentTab = 'home';
      renderCurrentTab();
      showToast(`Bem-vindo ao Sincrome, ${state.user.name}! +50 XP 🚀`, "🎉");
    }

    /* ========================================================
       GAMIFICATION & XP ENGINE
       ======================================================== */
    function addXP(amount, skillKey, reason) {
      state.user.xp += amount;
      
      if (skillKey && state.user.skills[skillKey]) {
        state.user.skills[skillKey].xp += amount;
        if (state.user.skills[skillKey].xp >= state.user.skills[skillKey].max) {
          state.user.skills[skillKey].level += 1;
          state.user.skills[skillKey].xp -= state.user.skills[skillKey].max;
          state.user.skills[skillKey].max = Math.round(state.user.skills[skillKey].max * 1.3);
          showToast(`Subiu de Nível em ${state.user.skills[skillKey].name}! Nível ${state.user.skills[skillKey].level}`, "⭐");
        }
      }

      if (state.user.xp >= state.user.xpNext) {
        state.user.level += 1;
        state.user.xp -= state.user.xpNext;
        state.user.xpNext = Math.round(state.user.xpNext * 1.3);
        showToast(`PARABÉNS! Você subiu para o Nível Geral ${state.user.level}!`, "🏆");
      } else {
        showToast(`+${amount} XP ${reason ? '(' + reason + ')' : ''}`, "✨");
      }

      saveState();
      renderCurrentTab();
    }

    function showToast(msg, icon = '🎉') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = msg;
      toastIcon.innerText = icon;

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 3000);
    }

    /* ========================================================
       ROUTING & TABS
       ======================================================== */
    let currentTab = 'home';

    function switchTab(tabId) {
      if (!state.onboardingDone) return;
      currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-600');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('text-brand-600');
        activeBtn.classList.remove('text-slate-400');
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (!state.onboardingDone) {
        renderOnboardingStep();
        return;
      }

      const bottomNav = document.getElementById('bottom-nav');
      if (bottomNav) bottomNav.classList.remove('hidden');

      const container = document.getElementById('content-container');
      switch (currentTab) {
        case 'home':
          container.innerHTML = getHomeHTML();
          break;
        case 'schedule':
          container.innerHTML = getScheduleHTML();
          break;
        case 'files':
          container.innerHTML = getFilesHTML();
          break;
        case 'ai':
          container.innerHTML = getAIHTML();
          break;
        case 'levels':
          container.innerHTML = getProfileHTML();
          break;
      }
    }

    /* ========================================================
       TAB 1: INÍCIO (COM RECOMENDAÇÃO INTELIGENTE & CHECKLIST DESBLOQUEÁVEL)
       ======================================================== */
    function getHomeHTML() {
      const pendingEvents = state.schedule.filter(e => !e.done);
      const userName = state.user.name || 'Estudante';
      const hasEvents = state.schedule.length > 0;
      const hasFiles = state.files.length > 0;
      const isSimuladoDone = !!state.simuladoCompleted;

      // Completed Tasks count
      const completedStepsCount = (hasEvents ? 1 : 0) + (hasFiles ? 1 : 0) + (isSimuladoDone ? 1 : 0);

      // Smart Study Recommendation Logic
      let recommendationHTML = '';
      if (hasEvents) {
        const sortedEvents = [...pendingEvents].sort((a, b) => getDaysUntil(a.date) - getDaysUntil(b.date));
        const nextEvent = sortedEvents[0] || state.schedule[0];
        const days = nextEvent ? getDaysUntil(nextEvent.date) : 99;
        const matchedSubject = state.subjects.find(s => s.name === nextEvent.subject) || state.subjects[0];
        const complexity = matchedSubject ? (matchedSubject.complexity || 'Alta Complexidade') : 'Conteúdo Importante';

        recommendationHTML = `
          <div class="p-4 rounded-3xl bg-gradient-to-br from-indigo-50 via-purple-50 to-brand-50 border border-brand-200 shadow-sm space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-brand-800 flex items-center gap-1.5">
                <span>🎯</span> Recomendação Inteligente de Estudo
              </span>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-brand-600 text-white shadow-xs">
                Baseado nos seus prazos
              </span>
            </div>

            <p class="text-xs text-slate-700 leading-relaxed">
              Sua atividade: <strong class="text-slate-900">${nextEvent.type}: "${nextEvent.title}"</strong> em 
              <strong class="text-brand-700">${nextEvent.subject}</strong> está marcada para 
              <strong>${formatDateBR(nextEvent.date)}</strong> (${days <= 0 ? 'em breve' : 'em ' + days + ' dias'}). 
              Por ser uma matéria de <span class="font-bold text-indigo-700">${complexity}</span>, recomendamos uma sessão leve de 15 minutos de flashcards hoje para não acumular na véspera.
            </p>

            <div class="flex items-center justify-between pt-1">
              <span class="text-[10px] text-brand-600 font-bold flex items-center gap-1">
                <span>🌙</span> Sem sobrecarga &bull; Preserve seu sono
              </span>
              <button onclick="startStudyForSubject('${matchedSubject ? matchedSubject.id : ''}')" class="px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/20 transition flex items-center gap-1">
                <span>Estudar Agora com IA</span> &rarr;
              </button>
            </div>
          </div>
        `;
      } else {
        recommendationHTML = `
          <div class="p-4 rounded-3xl bg-gradient-to-br from-indigo-50 to-brand-50 border border-brand-200 space-y-2">
            <div class="flex items-center gap-2">
              <span class="text-base">🎯</span>
              <h3 class="text-xs font-bold text-brand-900">Recomendação do Sincrome</h3>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">
              Assim que você subir o cronograma do professor ou cadastrar sua primeira aula/prova, nossa IA analisará a complexidade das matérias para indicar exatamente o que estudar a cada dia.
            </p>
            <button onclick="openUploadScheduleModal()" class="text-xs font-bold text-brand-600 hover:underline pt-1">
              + Subir Cronograma para ativar recomendações &rarr;
            </button>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <!-- User Greeting Header -->
          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-3">
              <div onclick="switchTab('levels')" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white font-bold text-lg flex items-center justify-center shadow-md shadow-brand-500/20 overflow-hidden cursor-pointer">
                ${state.user.avatar ? `<img src="${state.user.avatar}" class="w-full h-full object-cover">` : (userName[0] || 'S')}
              </div>
              <div>
                <h2 class="font-bold text-base text-slate-800 leading-tight">Olá, ${userName}! 👋</h2>
                <p class="text-xs text-slate-500">${state.user.course} &bull; ${state.user.semester || '1º Sem'}</p>
                <p class="text-[10px] text-brand-600 font-semibold">${state.user.institution}</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="switchTab('levels')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-600 font-bold text-xs border border-amber-500/20">
                <span>🔥</span>
                <span>${state.user.streakDays} dia</span>
              </button>
            </div>
          </div>

          <!-- SMART RECOMMENDATION BOX -->
          ${recommendationHTML}

          <!-- Motivational Card -->
          <div class="p-3.5 rounded-2xl bg-white border border-slate-200/80 shadow-xs flex items-start gap-3">
            <span class="text-xl">💡</span>

              <p class="text-xs font-semibold text-slate-800 italic">"Pequenos passos diários também te levam longe. Equilíbrio hoje também é progresso."</p>
              <p class="text-[10px] text-slate-400 font-medium mt-0.5">Sua rotina mais leve começa agora.</p>
            </div>
          </div>

          <!-- Prazos Próximos (Em Breve em tom acolhedor) -->
          ${hasEvents ? `
            <div class="space-y-2">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                <span>⏳</span> Prazos Próximos
              </h3>
              <div class="space-y-2">
                ${state.schedule.filter(e => !e.done).slice(0, 3).map(ev => {
                  const days = getDaysUntil(ev.date);
                  const isSoon = days <= 7;
                  return `
                    <div class="p-3.5 rounded-2xl border transition ${isSoon ? 'bg-amber-50/70 border-amber-300 text-amber-950 shadow-xs' : 'bg-white border-slate-200'} flex items-center justify-between gap-3">

              <div class="space-y-2">
                <div onclick="openUploadScheduleModal()" class="p-2.5 rounded-xl border ${hasEvents ? 'bg-emerald-50/50 border-emerald-200 text-slate-600' : 'bg-brand-50/40 border-brand-200 hover:border-brand-400 cursor-pointer'} flex items-center justify-between transition">

                      <p class="text-xs font-bold ${hasEvents ? 'line-through text-slate-400' : 'text-slate-800'}">Subir o cronograma do professor</p>
                      <p class="text-[10px] text-slate-500">Detecta datas de Aulas, Provas e Trabalhos</p>
                    </div>
                  </div>
                  <span class="text-[10px] font-bold ${hasEvents ? 'text-emerald-600' : 'text-brand-600'}">+40 XP</span>

                <div onclick="openUploadFileModal()" class="p-2.5 rounded-xl border ${hasFiles ? 'bg-emerald-50/50 border-emerald-200 text-slate-600' : 'bg-brand-50/40 border-brand-200 hover:border-brand-400 cursor-pointer'} flex items-center justify-between transition">
                  <div class="flex items-center gap-2.5">

                  </div>
                  <span class="text-[10px] font-bold ${hasFiles ? 'text-emerald-600' : 'text-brand-600'}">+25 XP</span>
                </div>

                <div onclick="switchTab('ai'); setAIStudyMode('simulado');" class="p-2.5 rounded-xl border ${isSimuladoDone ? 'bg-emerald-50/50 border-emerald-200 text-slate-600' : 'bg-brand-50/40 border-brand-200 hover:border-brand-400 cursor-pointer'} flex items-center justify-between transition">

                    <span class="w-5 h-5 rounded-full ${isSimuladoDone ? 'bg-emerald-500 text-white' : 'border-2 border-brand-400'} flex items-center justify-center text-[10px] font-black">

                  <span class="text-[10px] font-bold ${isSimuladoDone ? 'text-emerald-600' : 'text-brand-600'}">+30 XP</span>
                </div>

          <!-- Quick Action Buttons -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="openUploadScheduleModal()" class="p-3 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl shadow-md shadow-brand-600/20 font-bold text-xs flex items-center justify-center gap-2 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              Subir Cronograma
            </button>
            <button onclick="switchTab('ai')" class="p-3 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl shadow-md font-bold text-xs flex items-center justify-center gap-2 transition">
              <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
              Estudar com IA
            </button>
          </div>
        </div>
      `;
    }

    function startStudyForSubject(subjectId) {
      state.aiSettings.selectedSubjectId = subjectId;
      switchTab('ai');
    }

    /* ========================================================
       TAB 2: CRONOGRAMA & PLANNER (COM ABA DE AULAS POR TEMA)
       ======================================================== */
    let scheduleTypeFilter = 'Todos'; // 'Todos' | 'Aula' | 'Prova' | 'Trabalho'
    let schedulePeriodFilter = 'tudo';

    function getScheduleHTML() {
      let filtered = state.schedule;
      if (scheduleTypeFilter !== 'Todos') {
        filtered = filtered.filter(e => e.type === scheduleTypeFilter);
      }

      if (schedulePeriodFilter === 'semana') {
        filtered = filtered.filter(e => {
          const days = getDaysUntil(e.date);
          return days >= 0 && days <= 7;
        });
      } else if (schedulePeriodFilter === 'mes') {
        filtered = filtered.filter(e => {
          const days = getDaysUntil(e.date);
          return days >= 0 && days <= 30;
        });
      }

      return `
        <div class="space-y-4">
          <!-- Header & Actions -->
          <div class="flex items-center justify-between pt-1">
            <div>
              <h2 class="font-bold text-base text-slate-800">Cronograma Completo</h2>
              <p class="text-xs text-slate-500">Aulas por tema, provas e trabalhos.</p>
            </div>
            <button onclick="openUploadScheduleModal()" class="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              Novo
            </button>
          </div>

          <!-- Type Filters: TODOS, AULAS (POR TEMA), PROVAS, TRABALHOS -->
          <div class="grid grid-cols-4 gap-1 p-1 bg-slate-200/70 rounded-2xl text-[11px] font-bold">
            <button onclick="setScheduleTypeFilter('Todos')" class="py-2 rounded-xl transition ${scheduleTypeFilter === 'Todos' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
              Todos
            </button>
            <button onclick="setScheduleTypeFilter('Aula')" class="py-2 rounded-xl transition flex items-center justify-center gap-1 ${scheduleTypeFilter === 'Aula' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
              <span>📚</span> Aulas
            </button>
            <button onclick="setScheduleTypeFilter('Prova')" class="py-2 rounded-xl transition flex items-center justify-center gap-1 ${scheduleTypeFilter === 'Prova' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
              <span>📝</span> Provas
            </button>
            <button onclick="setScheduleTypeFilter('Trabalho')" class="py-2 rounded-xl transition flex items-center justify-center gap-1 ${scheduleTypeFilter === 'Trabalho' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
              <span>💼</span> Trabalhos
            </button>
          </div>

          <!-- Time Period Filters: Esta Semana, Este Mês, Tudo -->
          <div class="flex items-center gap-1.5">
            <button onclick="setSchedulePeriodFilter('semana')" class="px-3 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1 ${schedulePeriodFilter === 'semana' ? 'bg-slate-900 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'}">
              <span>⚡</span> Esta Semana (7 Dias)
            </button>
            <button onclick="setSchedulePeriodFilter('mes')" class="px-3 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1 ${schedulePeriodFilter === 'mes' ? 'bg-slate-900 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'}">
              <span>🗓️</span> Este Mês
            </button>
            <button onclick="setSchedulePeriodFilter('tudo')" class="px-3 py-1.5 rounded-full text-xs font-bold transition ${schedulePeriodFilter === 'tudo' ? 'bg-slate-900 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'}">
              Tudo
            </button>
          </div>

          <!-- Events / Classes List with Theme/Subject clearly separated -->
          ${filtered.length > 0 ? `
            <div class="space-y-2.5">
              ${filtered.map(ev => {
                const days = getDaysUntil(ev.date);
                const isSoon = !ev.done && (days <= 7 && days >= 0);
                const isPast = days < 0;

                return `
                  <div class="p-3.5 rounded-2xl border transition space-y-2 ${isSoon ? 'border-2 border-amber-300 bg-amber-50/70 shadow-sm text-amber-950' : 'bg-white border-slate-200/80 shadow-xs'}">
                    
                    ${isSoon ? `
                      <div class="flex items-center justify-between pb-1 border-b border-amber-200 text-amber-800">
                        <span class="text-[11px] font-black flex items-center gap-1">
                          <span>⏳</span> EM BREVE: FALTAM ${days === 0 ? 'POUCAS HORAS' : days + ' DIAS'}
                        </span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500 text-white">Revisar no Ritmo</span>
                      </div>
                    ` : ''}

                    <div class="flex items-start justify-between gap-2">
                      <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${ev.type === 'Aula' ? 'bg-purple-100 text-purple-700' : (ev.type === 'Prova' ? 'bg-indigo-100 text-indigo-700' : 'bg-brand-100 text-brand-700')}">
                          ${ev.type === 'Aula' ? '📚 Aula' : ev.type}
                        </span>
                        <span class="text-xs font-bold text-slate-800">${ev.subject}</span>
                      </div>
                      <div class="flex items-center gap-1">
                        <button onclick="openEditEventModal('${ev.id}')" class="p-1 text-slate-400 hover:text-brand-600 transition" title="Editar">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                        <button onclick="deleteEvent('${ev.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition" title="Excluir">
                          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                      </div>
                    </div>

                    <!-- TEMA DA AULA / TÍTULO SEPARADO -->
                    <div class="flex items-start gap-3">
                      <button onclick="toggleEventDone('${ev.id}')" class="mt-0.5 w-5 h-5 rounded-lg border-2 ${ev.done ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300'} flex items-center justify-center transition shrink-0">
                        ${ev.done ? '✓' : ''}
                      </button>
                      <div>
                        <p class="text-xs font-bold ${ev.done ? 'line-through text-slate-400' : 'text-slate-800'}">
                          ${ev.type === 'Aula' ? 'Tema: ' : ''}${ev.title}
                        </p>
                      </div>
                    </div>

                    <div class="flex items-center justify-between text-[11px] pt-1 border-t ${isSoon ? 'border-amber-200 text-amber-800 font-semibold' : 'border-slate-100 text-slate-400'}">
                      <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        Data: ${formatDateBR(ev.date)} &bull; ${ev.time}
                      </span>
                      <span class="text-[10px] font-medium">${isPast ? 'Data anterior' : (ev.priority || 'Normal')}</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="p-8 bg-white rounded-3xl border border-dashed border-slate-200 text-center space-y-3">
              <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center mx-auto text-xl font-bold">
                📅
              </div>
              <div>
                <h3 class="text-sm font-bold text-slate-800">Nenhum item com esse filtro</h3>
                <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">
                  Suba o cronograma com aulas e temas para preencher tudo à risca.
                </p>
              </div>
              <div class="flex flex-col gap-2 pt-2 max-w-xs mx-auto">
                <button onclick="openUploadScheduleModal()" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/20 transition">
                  📥 Subir Arquivo do Cronograma
                </button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    function setScheduleTypeFilter(type) {
      scheduleTypeFilter = type;
      renderCurrentTab();
    }

    function setSchedulePeriodFilter(period) {
      schedulePeriodFilter = period;
      renderCurrentTab();
    }

    function toggleEventDone(id) {
      const ev = state.schedule.find(e => e.id === id);
      if (ev) {
        ev.done = !ev.done;
        if (ev.done) {
          state.user.tasksDone += 1;
          addXP(25, 'organizacao', 'Concluiu Tarefa da Agenda');
        } else {
          saveState();
          renderCurrentTab();
        }
      }
    }

    function deleteEvent(id) {
      if (confirm("Deseja remover este item do seu cronograma?")) {
        state.schedule = state.schedule.filter(e => e.id !== id);
        saveState();
        renderCurrentTab();
        showToast("Item removido.", "🗑️");
      }
    }

    /* ========================================================
       TAB 3: ARQUIVOS & BIBLIOTECA DIGITAL (COM UPLOAD REAL E CONTEÚDO)
       ======================================================== */
    let selectedSubjectFileFilter = 'all';

    function getFilesHTML() {
      const filteredFiles = selectedSubjectFileFilter === 'all'
        ? state.files
        : state.files.filter(f => f.subjectId === selectedSubjectFileFilter);

      return `
        <div class="space-y-4">
          <!-- Header -->
          <div class="flex items-center justify-between pt-1">
            <div>
              <h2 class="font-bold text-base text-slate-800">Biblioteca de Estudos</h2>
              <p class="text-xs text-slate-500">Seus materiais em PDF, Slides e Documentos.</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="openAddSubjectModal()" class="px-2.5 py-1.5 rounded-xl bg-brand-50 hover:bg-brand-100 text-brand-600 text-xs font-bold flex items-center gap-1 border border-brand-200 transition" title="Adicionar matéria esquecida">
                <span>➕</span> Matéria
              </button>
              <button onclick="openUploadFileModal()" class="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold flex items-center gap-1 shadow-sm transition">
                <span>+</span> Upload
              </button>
            </div>
          </div>

          <!-- Disciplinas do Próprio Aluno -->
          <div class="space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Suas Disciplinas</h3>
            <div class="grid grid-cols-2 gap-2">
              ${state.subjects.map(s => {
                const count = state.files.filter(f => f.subjectId === s.id).length;
                const isSelected = selectedSubjectFileFilter === s.id;
                return `
                  <button onclick="filterFilesBySubject('${s.id}')" class="p-3 rounded-2xl border text-left transition ${isSelected ? 'bg-brand-50 border-brand-500 shadow-xs' : 'bg-white border-slate-200/80 hover:border-slate-300'}">
                    <span class="text-xs font-bold text-slate-800 line-clamp-1">${s.name}</span>
                    <p class="text-[10px] text-slate-400 mt-1">${count} arquivos &bull; ${s.complexity || 'Conteúdo'}</p>
                  </button>
                `;
              }).join('')}

              <!-- Card para Adicionar Matéria Esquecida -->
              <button onclick="openAddSubjectModal()" class="p-3 rounded-2xl border-2 border-dashed border-brand-300 hover:border-brand-500 bg-brand-50/40 hover:bg-brand-50 text-left transition flex flex-col justify-center items-center text-center group cursor-pointer">
                <span class="w-6 h-6 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-black text-xs mb-1 group-hover:scale-110 transition">＋</span>
                <span class="text-xs font-bold text-brand-700">Nova Matéria</span>
                <p class="text-[9px] text-slate-400">Esqueceu alguma?</p>
              </button>
            </div>
            ${selectedSubjectFileFilter !== 'all' ? `
              <button onclick="filterFilesBySubject('all')" class="text-xs font-bold text-brand-600 hover:underline pt-1">
                &larr; Ver todas as disciplinas
              </button>
            ` : ''}
          </div>

          <!-- Files List or Empty State -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Arquivos Salvos (${filteredFiles.length})</h3>
              <span class="text-[10px] text-emerald-600 font-semibold flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Salvo no Aparelho
              </span>
            </div>

            ${filteredFiles.length > 0 ? `
              <div class="space-y-2">
                  ${filteredFiles.map(f => {
                  const sub = state.subjects.find(s => s.id === f.subjectId) || { name: 'Geral' };
                  return `
                    <div onclick="openFilePreviewModal('${f.id}')" class="p-3 bg-white rounded-2xl border border-slate-200/80 shadow-xs flex items-center justify-between gap-3 hover:border-brand-300 hover:shadow-sm cursor-pointer transition">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-xs font-bold text-white shrink-0 ${f.type === 'pdf' ? 'bg-rose-500' : f.type === 'slides' ? 'bg-amber-500' : f.type === 'doc' ? 'bg-blue-500' : 'bg-emerald-500'}">
                          ${f.type.toUpperCase()}
                        </div>
                        <div class="min-w-0">
                          <p class="text-xs font-bold text-slate-800 truncate">${f.name}</p>
                          <p class="text-[10px] text-slate-400 truncate">${sub.name} &bull; ${f.size} &bull; ${f.date}</p>
                        </div>
                      </div>
                      <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
                        <button onclick="startAIWithSingleFile('${f.id}', '${f.subjectId}')" class="px-2.5 py-1 rounded-xl bg-brand-50 hover:bg-brand-100 text-brand-600 text-xs font-bold transition">
                          Estudar
                        </button>
                        <button onclick="deleteFile('${f.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <div class="p-6 bg-white rounded-2xl border border-slate-200 text-center space-y-2">
                <span class="text-2xl">📚</span>
                <p class="text-xs font-bold text-slate-700">Nenhum arquivo anexado ainda</p>
                <p class="text-[10px] text-slate-400">Faça o upload real dos seus slides e apostilas para estudar com IA.</p>
                <button onclick="openUploadFileModal()" class="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-sm transition">
                  + Fazer Upload Real
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function filterFilesBySubject(id) {
      selectedSubjectFileFilter = id;
      renderCurrentTab();
    }

    function deleteFile(id) {
      if (confirm("Deseja apagar este arquivo da sua biblioteca?")) {
        state.files = state.files.filter(f => f.id !== id);
        saveState();
        renderCurrentTab();
        showToast("Arquivo removido.", "🗑️");
      }
    }

    /* ========================================================
       TAB 4: ASSISTENTE DE IA COM SELEÇÃO DE MATÉRIA, CHECKBOXES & CONTEÚDO REAL
       ======================================================== */
    let currentAIStudyMode = 'resumo';
    let currentFlashcardIndex = 0;
    let isFlashcardFlipped = false;

    function getAIHTML() {
      // Step 1: If no subject selected yet, show Subject Picker screen!
      if (!state.aiSettings.selectedSubjectId) {
        return `
          <div class="space-y-4 pt-1 animate-fade-in">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white flex items-center justify-center font-bold text-sm shadow-md">

                  <p class="text-[10px] text-slate-500">Qual matéria você deseja estudar agora?</p>

              <button onclick="setAIStudyMode('offline')" class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                💾 Salvos Offline (${state.offlineMaterials.length})
              </button>
            </div>

            <div class="p-3 bg-brand-50 border border-brand-200 rounded-2xl flex items-center gap-2.5">
              <span class="text-xl">🎯</span>
              <p class="text-xs text-brand-900 font-medium">
                Selecione uma das suas matérias abaixo para escolher exatamente quais documentos a IA deve usar.
              </p>
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Escolha a Disciplina:</h3>
                <button onclick="openAddSubjectModal()" class="text-xs font-bold text-brand-600 hover:text-brand-800 flex items-center gap-1">
                  <span>➕</span> Adicionar Matéria
                </button>
              </div>
              <div class="space-y-2">
                ${state.subjects.map(s => {
                  const subjectFiles = state.files.filter(f => f.subjectId === s.id);
                  return `
                    <div onclick="selectSubjectForAI('${s.id}')" class="p-3.5 bg-white rounded-2xl border border-slate-200 hover:border-brand-500 shadow-xs cursor-pointer flex items-center justify-between transition group">
                      <div>
                        <h4 class="text-xs font-bold text-slate-800 group-hover:text-brand-600 transition">${s.name}</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5">${subjectFiles.length} documentos anexados &bull; ${s.complexity || 'Conteúdo Estruturado'}</p>
                      </div>
                      <span class="w-8 h-8 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-xs group-hover:bg-brand-600 group-hover:text-white transition">
                        &rarr;
                      </span>
                    </div>
                  `;
                }).join('')}

                <!-- Banner para adicionar matéria que esqueceu no Onboarding -->
                <div onclick="openAddSubjectModal()" class="p-3.5 bg-brand-50/50 hover:bg-brand-50 rounded-2xl border-2 border-dashed border-brand-300 hover:border-brand-500 cursor-pointer flex items-center justify-between transition group">
                  <div class="flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-xl bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-base">＋</span>
                    <div>
                      <h4 class="text-xs font-bold text-brand-800">Adicionar Matéria Esquecida</h4>
                      <p class="text-[10px] text-slate-500">Esqueceu de cadastrar? Adicione aqui para estudar com IA.</p>
                    </div>
                  </div>
                  <span class="text-xs font-bold text-brand-600 group-hover:translate-x-1 transition">&rarr;</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

    function selectSubjectForAI(subjectId) {
      state.aiSettings.selectedSubjectId = subjectId;
      const subjectFiles = state.files.filter(f => f.subjectId === subjectId);
      state.aiSettings.selectedFileIds = subjectFiles.map(f => f.id);
      saveState();
      renderCurrentTab();
    }

    function clearSelectedAISubject() {
      state.aiSettings.selectedSubjectId = null;
      state.aiSettings.selectedFileIds = [];
      saveState();
      renderCurrentTab();
    }

    function toggleAIFileSelection(fileId) {
      const idx = state.aiSettings.selectedFileIds.indexOf(fileId);
      if (idx >= 0) {
        state.aiSettings.selectedFileIds.splice(idx, 1);
      } else {
        state.aiSettings.selectedFileIds.push(fileId);
      }
      saveState();
      renderCurrentTab();
    }

    function startAIWithSingleFile(fileId, subjectId) {
      state.aiSettings.selectedSubjectId = subjectId;
      state.aiSettings.selectedFileIds = [fileId];
      saveState();
      switchTab('ai');
      setAIStudyMode('resumo');
      showToast("Arquivo carregado para estudo na IA!", "⚡");
    }

    function toggleWebSearch(val) {
      state.aiSettings.useWebSearch = val;
      saveState();
      renderCurrentTab();
      showToast(val ? "Modo de pesquisa aberta na web ativado!" : "Modo fechado nos arquivos marcados!", "⚙️");
    }

    function setAIStudyMode(mode) {
      currentAIStudyMode = mode;
      renderCurrentTab();
    }

    /* REAL INFORMATION EXTRACTOR FOR STUDENT'S UPLOADED FILES */

    // Detecta conteúdo binário/garbled (PDF raw, etc.)
    function isReadableText(str) {
      if (!str || str.length < 10) return false;
      if (str.startsWith('%PDF') || str.startsWith('PK\x03\x04')) return false;
      const sample = str.slice(0, 500);
      const nonPrintable = (sample.match(/[\x00-\x08\x0E-\x1F\x7F]/g) || []).length;
      return (nonPrintable / sample.length) < 0.08;
    }

    function getAIToolContentHTML(subject) {
      const subjectName = subject.name;
      const selectedFiles = state.files.filter(f => state.aiSettings.selectedFileIds.includes(f.id));
      
      // Build real summary content based on actual file content or file names
      let realSummaryPoints = '';
      if (selectedFiles.length > 0) {
        realSummaryPoints = selectedFiles.map((file, i) => {
          const readable = isReadableText(file.content);
          const contentSnippet = readable ? file.content.slice(0, 400) : null;
          return `
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 space-y-1">
              <span class="text-[10px] font-bold text-brand-600 uppercase tracking-wider">Documento ${i+1}: ${file.name}</span>
              <p class="text-xs text-slate-700 leading-relaxed font-medium">
                ${contentSnippet ? contentSnippet : `Conteúdo da aula disponível para estudo.\n📌 Disciplina: ${subjectName}\n📄 Arquivo: ${file.name}\nRevise os conceitos-chave, definições e estruturas da matéria usando o arquivo carregado.`}

        realSummaryPoints = `

            window._flashcardDeckSubject = subjectName;

                  </div>

                  <div class="flashcard-back absolute inset-0 bg-gradient-to-br from-brand-600 to-indigo-700 text-white rounded-2xl p-5 flex flex-col justify-between items-center text-center">
                    <span class="text-[10px] font-bold text-brand-200 uppercase tracking-widest bg-white/10 px-2 py-0.5 rounded-full">Resposta & Explicação</span>

          `;

        case 'mapa':
          return `
            <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-3">

                <div class="grid grid-cols-2 gap-2">
                  <div class="p-2 bg-purple-50 border border-purple-200 rounded-xl text-center">
                    <p class="text-[10px] font-black text-purple-800">CONCEITOS CHAVE</p>

                  </div>

                    <p class="text-[10px] font-black text-indigo-800">MÉTODOS & PRÁTICA</p>
                    <p class="text-[9px] text-indigo-600 mt-0.5">Processos de aplicação no mercado</p>
                  </div>
                  <div class="p-2 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
                    <p class="text-[10px] font-black text-emerald-800">FOCO EM PROVAS</p>
                    <p class="text-[9px] text-emerald-600 mt-0.5">Padrões de questões e temas recorrentes</p>
                  </div>
                  <div class="p-2 bg-amber-50 border border-amber-200 rounded-xl text-center">
                    <p class="text-[10px] font-black text-amber-800">TRABALHOS & CASES</p>
                    <p class="text-[9px] text-amber-600 mt-0.5">Estrutura para entregas e apresentações</p>
                  </div>

              </div>

              <p class="text-[10px] text-center text-slate-400">Diagrama disponível para consulta 100% offline.</p>

        case 'simulado':

            <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-xs space-y-3">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <div>
                  <span class="text-[10px] font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-full">Simulado Interativo</span>

                  <p class="text-[11px] leading-relaxed">
                    ${sim.isCorrect 
                      ? 'Parabéns! O <strong>Ciclo PDCA (Plan, Do, Check, Act)</strong> é a ferramenta clássica da Gestão Comercial para planejar, executar, checar dados e aplicar melhorias contínuas. <em>Tarefa do Início concluída!</em>'

        case 'offline':

      if (el) {

      }
    }

    function handleFlashcardReview(success) {
      if (success) {

    function parseCustomScheduleText() {
      const text = document.getElementById('schedule-paste-area').value;
      if (!text) return;

      const lines = text.split('\n');
      const parsed = [];
      const currentYear = new Date().getFullYear();
      const dateRegex = /(\d{1,2})[\/\-\.](\d{1,2})(?:[\/\-\.](\d{2,4}))?/;

      lines.forEach(line => {
        const match = line.match(dateRegex);
        if (match) {
          const day = String(match[1]).padStart(2, '0');
          const month = String(match[2]).padStart(2, '0');
          const year = match[3] ? (match[3].length === 2 ? '20' + match[3] : match[3]) : currentYear;
          const dateISO = `${year}-${month}-${day}`;

          const cleanTitle = line.replace(match[0], '').replace(/[-:]/g, ' ').trim();
          const lower = cleanTitle.toLowerCase();
          
          let type = 'Aula';
          if (lower.includes('prova') || lower.includes('p1') || lower.includes('p2') || lower.includes('exame') || lower.includes('avaliacao')) {
            type = 'Prova';
          } else if (lower.includes('trabalho') || lower.includes('entrega') || lower.includes('case') || lower.includes('projeto')) {
            type = 'Trabalho';
          }

          parsed.push({
            title: cleanTitle.slice(0, 45) || (type === 'Aula' ? 'Tema da Aula' : type),
            type,
            date: dateISO,
            time: '19:15',
            priority: 'Normal'
          });
        }
      });

      if (parsed.length > 0) {
        detectedEventsTemp = parsed;
        document.getElementById('exact-dates-container').innerHTML = renderDetectedRowsHTML();
        showToast(`${parsed.length} itens extraídos à risca!`, "📅");
      }
    }

        const typeEl = document.getElementById(`row-type-${i}`);
        const dateEl = document.getElementById(`row-date-${i}`);
        const timeEl = document.getElementById(`row-time-${i}`);

        if (titleEl && dateEl) {
          finalEvents.push({
            id: 'ev-exact-' + Date.now() + '-' + i,
            title: titleEl.value.trim() || 'Aula / Conteúdo',
            type: typeEl.value,
            date: dateEl.value,
            time: timeEl.value.trim() || '19:15',
            priority: 'Normal',
            done: false
          });
        }
      }

      const subjectSelect = document.getElementById('upload-subject-select');
      const subjectId = subjectSelect.value;
      const subject = state.subjects.find(s => s.id === subjectId) || { name: 'Disciplina' };

      finalEvents.forEach(ev => {
        ev.subjectId = subjectId;
        ev.subject = subject.name;
      });

      // Anti-duplication: replace previous events for this subject
      state.schedule = state.schedule.filter(e => e.subjectId !== subjectId);
      state.schedule = [...state.schedule, ...finalEvents];

      addXP(40, 'organizacao', 'Cronograma com temas e datas reais salvo');
      saveState();
      closeModal();
      renderCurrentTab();
      showToast(`Itens de ${subject.name} salvos com sucesso!`, "📅");
    }
