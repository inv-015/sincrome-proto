                  <option value="__NEW__" class="font-bold text-brand-600">➕ Nova matéria...</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Categoria:</label>
                <select id="ev-form-type" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-bold text-brand-700">
                  <option value="Aula" ${isEdit && ev.type === 'Aula' ? 'selected' : ''}>📚 Aula (com Tema)</option>
                  <option value="Prova" ${isEdit && ev.type === 'Prova' ? 'selected' : ''}>📝 Prova</option>
                  <option value="Trabalho" ${isEdit && ev.type === 'Trabalho' ? 'selected' : ''}>💼 Trabalho</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Data:</label>
                <input type="date" id="ev-form-date" value="${isEdit ? ev.date : todayISO}" class="w-full p-2.5 rounded-xl border border-slate-300">
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Horário:</label>
                <input type="text" id="ev-form-time" value="${isEdit ? ev.time : '19:15'}" placeholder="19:15" class="w-full p-2.5 rounded-xl border border-slate-300">
              </div>
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Prioridade:</label>
              <select id="ev-form-priority" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white">
                <option value="Normal" ${isEdit && ev.priority === 'Normal' ? 'selected' : ''}>Normal</option>
                <option value="Alta" ${isEdit && ev.priority === 'Alta' ? 'selected' : ''}>Alta</option>
              </select>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-2">
            <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50">
              Cancelar
            </button>
            <button onclick="saveEventForm('${isEdit ? ev.id : ''}')" class="w-1/2 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-xs font-bold text-white shadow-md shadow-brand-500/20">
              ${isEdit ? 'Salvar Alterações' : 'Salvar no Cronograma'}
            </button>
          </div>
        </div>
      `;
      container.classList.remove('hidden');
    }

    function saveEventForm(editId) {
      const title = document.getElementById('ev-form-title').value.trim();
      const subject = document.getElementById('ev-form-subject').value;
      const type = document.getElementById('ev-form-type').value;
      const date = document.getElementById('ev-form-date').value;
      const time = document.getElementById('ev-form-time').value.trim();
      const priority = document.getElementById('ev-form-priority').value;

      if (!title) {
        alert("Por favor, digite um título ou tema!");
        return;
      }

      if (editId) {
        const ev = state.schedule.find(e => e.id === editId);
        if (ev) {
          ev.title = title;
          ev.subject = subject;
          ev.type = type;
          ev.date = date;
          ev.time = time;
          ev.priority = priority;
          showToast("Item atualizado com sucesso!", "✏️");
        }
      } else {
        const newEv = {
          id: 'ev-' + Date.now(),
          subjectId: 'sub-user-custom',
          subject,
          title,
          date,
          time: time || '19:15',
          type,
          priority,
          done: false
        };
        state.schedule.unshift(newEv);
        addXP(20, 'planejamento', 'Novo item adicionado');
      }

      saveState();
      closeModal();
      renderCurrentTab();
    }

    /* ========================================================
       MODALS: UPLOAD REAL DE ARQUIVOS (COM EXTRAÇÃO REAL DE TEXTO)
       ======================================================== */
    let selectedRealFile = null;
    let extractedFileText = '';

    function openUploadFileModal(preselectedSubjectId = null) {
      if (!preselectedSubjectId) {
        selectedRealFile = null;
        extractedFileText = '';
      }
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-200">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
              <span>📥</span> Upload Real de Arquivo
            </h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 font-bold">&times;</button>
          </div>

          <div class="border-2 border-dashed border-brand-300 bg-brand-50/50 rounded-2xl p-4 text-center cursor-pointer" onclick="document.getElementById('real-file-picker').click()">
            <input type="file" id="real-file-picker" class="hidden" onchange="handleRealFileSelected(this)">
            <span class="text-2xl">📂</span>
            <p class="text-xs font-bold text-slate-800 mt-1" id="file-picker-label">${selectedRealFile ? `Selecionado: ${selectedRealFile.name}` : 'Clique para escolher o arquivo do seu aparelho'}</p>
            <p class="text-[10px] text-slate-500" id="file-picker-sublabel">${selectedRealFile ? `Tamanho: ${(selectedRealFile.size / 1024).toFixed(1)} KB` : 'Lê PDFs, Slides (PPTX), Documentos ou Anotações'}</p>
          </div>

          <div class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">Nome de Exibição:</label>
              <input type="text" id="file-name-input" value="${selectedRealFile ? selectedRealFile.name : ''}" placeholder="Ex: Apostila Aula 4 - Gestão Comercial.pdf" class="w-full p-2.5 rounded-xl border border-slate-300">
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block font-bold text-slate-700">Disciplina correspondente:</label>
                <button type="button" onclick="openAddSubjectModal('upload-file')" class="text-[11px] font-bold text-brand-600 hover:text-brand-800 flex items-center gap-0.5">
                  <span>➕</span> Nova Matéria
                </button>
              </div>
              <select id="file-subject-select" onchange="if(this.value==='__NEW__'){openAddSubjectModal('upload-file')}" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-medium">
                ${state.subjects.map(s => `<option value="${s.id}" ${preselectedSubjectId === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
                <option value="__NEW__" class="font-bold text-brand-600">➕ Cadastrar nova matéria...</option>
              </select>
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Tipo de Documento:</label>
              <select id="file-type-select" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white">
                <option value="pdf">PDF (Apostila / E-book / Prova)</option>
                <option value="slides">Slides (Apresentação / PPTX)</option>
                <option value="doc">Documento (Word / Resumo)</option>
                <option value="note">Anotação de Aula (Texto)</option>
              </select>
            </div>

            <!-- Optional text preview / paste for full AI fidelity -->
            <div>
              <label class="block font-bold text-slate-700 mb-1">Texto / Conteúdo do Documento para a IA:</label>
              <textarea id="file-content-input" rows="2" placeholder="O texto extraído do seu arquivo aparecerá aqui para a IA resumir com fidelidade real..." class="w-full p-2.5 text-[11px] rounded-xl border border-slate-300"></textarea>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-2">
            <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600">
              Cancelar
            </button>
            <button onclick="saveRealUploadedFile()" class="w-1/2 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-xs font-bold text-white shadow-md shadow-brand-500/20">
              Salvar na Biblioteca
            </button>
          </div>
        </div>
      `;
      container.classList.remove('hidden');
    }

    function handleRealFileSelected(input) {
      if (input.files && input.files[0]) {
        selectedRealFile = input.files[0];
        document.getElementById('file-picker-label').innerText = `Selecionado: ${selectedRealFile.name}`;
        document.getElementById('file-picker-sublabel').innerText = `Tamanho: ${(selectedRealFile.size / 1024).toFixed(1)} KB`;
        document.getElementById('file-name-input').value = selectedRealFile.name;

        const ext = selectedRealFile.name.split('.').pop().toLowerCase();
        const typeSelect = document.getElementById('file-type-select');
        if (ext === 'pdf') typeSelect.value = 'pdf';
        else if (ext === 'pptx' || ext === 'ppt') typeSelect.value = 'slides';
        else if (ext === 'docx' || ext === 'doc') typeSelect.value = 'doc';
        else typeSelect.value = 'note';

        // Read real text content
        const reader = new FileReader();
        reader.onload = function(e) {
          extractedFileText = e.target.result;
          if (typeof extractedFileText === 'string') {
            document.getElementById('file-content-input').value = extractedFileText.slice(0, 1000);
          }
        };
        reader.readAsText(selectedRealFile);

        showToast("Arquivo carregado e lido!", "📁");
      }
    }

    function saveRealUploadedFile() {
      const name = document.getElementById('file-name-input').value.trim() || (selectedRealFile ? selectedRealFile.name : 'Arquivo de Estudo.pdf');
      const subjectId = document.getElementById('file-subject-select').value;
      const type = document.getElementById('file-type-select').value;
      const content = document.getElementById('file-content-input').value.trim() || extractedFileText;

      const sizeStr = selectedRealFile ? `${(selectedRealFile.size / (1024 * 1024)).toFixed(1)} MB` : '1.8 MB';

      state.files.unshift({
        id: 'f-' + Date.now(),
        subjectId,
        name,
        size: sizeStr,
        date: 'Hoje',
        type,
        content: content || `Arquivo real: ${name}. Contém conceitos fundamentais, definições teóricas e práticas da matéria.`,
        offline: true
      });

      addXP(25, 'organizacao', 'Upload real com extração de conteúdo');
      saveState();
      closeModal();
      renderCurrentTab();
      showToast("Arquivo salvo na biblioteca com conteúdo real!", "📥");
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    /* ========================================================
       MODAL: ADICIONAR NOVA MATÉRIA ESQUECIDA (COM AUTO-CORREÇÃO & HISTÓRICO)
       ======================================================== */
    let currentAddSubjectContext = null;

    function openAddSubjectModal(sourceContext = null) {
      currentAddSubjectContext = sourceContext;
      const container = document.getElementById('modal-container');
      container.innerHTML = `
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl border border-slate-200 animate-fade-in max-h-[90vh] overflow-y-auto custom-scrollbar">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-8 h-8 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-base">📚</span>
              <div>
                <h3 class="text-sm font-bold text-slate-800">Adicionar Matéria</h3>
                <p class="text-[10px] text-slate-400">Esqueceu de incluir no cadastro?</p>
              </div>
            </div>
            <button onclick="closeAddSubjectModal()" class="text-slate-400 hover:text-slate-600 p-1 font-bold text-sm">&times;</button>
          </div>

          <p class="text-xs text-slate-600 leading-relaxed">
            Digite o nome da matéria abaixo. O corretor inteligente ajustará automaticamente a pontuação, acentuação e letras maiúsculas.
          </p>

          <div class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">Nome da Matéria:</label>
              <input 
                type="text" 
                id="modal-new-subject-name" 
                placeholder="Ex: gestao financeira, direito, estatistica..." 
                class="w-full p-3 rounded-xl border-2 border-slate-200 focus:border-brand-600 focus:outline-none text-xs font-semibold bg-white"
                oninput="previewSubjectSpellcheck(this.value)"
                onkeypress="if(event.key === 'Enter') saveNewSubject()"
              >
            </div>

            <!-- Live spellcheck preview -->
            <div id="modal-subject-preview" class="hidden p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-[11px] text-emerald-800 font-semibold flex items-center gap-1.5">
              <span>✨</span>
              <span>Como ficará: <strong id="modal-subject-preview-text"></strong></span>
            </div>

            <div>
              <label class="block font-bold text-slate-700 mb-1">Complexidade / Peso dos Estudos:</label>
              <select id="modal-new-subject-complexity" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-medium text-xs">
                <option value="Alta Complexidade">Alta Complexidade (Cálculo, Leis, Projetos Densos)</option>
                <option value="Média Complexidade" selected>Média Complexidade (Teoria, Análise, Gestão)</option>
                <option value="Leve / Prática">Leve / Prática (Comunicação, Oficinas)</option>
              </select>
            </div>

            <!-- Sugestões Rápidas -->
            <div class="space-y-1 pt-1">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sugestões rápidas:</span>
              <div class="flex flex-wrap gap-1">
                ${['Gestão Financeira', 'Direito Empresarial', 'Estatística Aplicada', 'Economia de Mercado', 'Ética e Cidadania'].map(sub => `
                  <button type="button" onclick="selectModalSubjectSuggestion('${sub}')" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-brand-50 hover:text-brand-600 text-[10px] font-medium text-slate-600 transition border border-slate-200">
                    + ${sub}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Lista de matérias já cadastradas com botão para remover se quiser -->
            <div class="space-y-1.5 pt-2 border-t border-slate-100">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Matérias cadastradas (${state.subjects.length}):</span>
              </div>
              <div class="flex flex-wrap gap-1 max-h-24 overflow-y-auto custom-scrollbar p-1.5 bg-slate-50 rounded-xl border border-slate-200/80">
                ${state.subjects.map(s => `
                  <span class="px-2 py-0.5 rounded-lg bg-white border border-slate-200 text-[10px] font-bold text-slate-700 flex items-center gap-1 shadow-2xs">
                    <span>${s.name}</span>
                    <button type="button" onclick="deleteSubjectFromList('${s.id}')" class="text-slate-400 hover:text-rose-500 font-black ml-0.5" title="Remover matéria">&times;</button>
                  </span>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <button onclick="closeAddSubjectModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50 transition">
              ${currentAddSubjectContext ? '← Voltar' : 'Cancelar'}
            </button>
            <button onclick="saveNewSubject()" class="w-1/2 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-xs font-bold text-white shadow-md shadow-brand-500/20 transition flex items-center justify-center gap-1">
              <span>Salvar Matéria</span>
              <span class="text-amber-200 text-[10px]">+15 XP</span>
            </button>
          </div>
        </div>
      `;
      container.classList.remove('hidden');
      setTimeout(() => {
        const inp = document.getElementById('modal-new-subject-name');
        if (inp) inp.focus();
      }, 50);
    }

    function previewSubjectSpellcheck(val) {
      const preview = document.getElementById('modal-subject-preview');
      const text = document.getElementById('modal-subject-preview-text');
      if (!val || val.trim().length === 0) {
        preview.classList.add('hidden');
        return;
      }
      const formatted = autocorrectSubjectName(val);
      text.innerText = formatted;
      preview.classList.remove('hidden');
    }

    function selectModalSubjectSuggestion(name) {
      const inp = document.getElementById('modal-new-subject-name');
      if (inp) {
        inp.value = name;
        previewSubjectSpellcheck(name);
      }
    }

    function closeAddSubjectModal() {
      const ctx = currentAddSubjectContext;
      currentAddSubjectContext = null;
      if (ctx === 'upload-file') {
        openUploadFileModal();
      } else if (ctx === 'upload-schedule') {
        openUploadScheduleModal();
      } else if (ctx === 'add-event') {
        openAddEventModal();
      } else {
        closeModal();
      }
    }

    function saveNewSubject() {
      const inp = document.getElementById('modal-new-subject-name');
      const raw = inp.value.trim();
      if (!raw) {
        alert("Por favor, digite o nome da matéria!");
        return;
      }

      const formatted = autocorrectSubjectName(raw);
      const complexity = document.getElementById('modal-new-subject-complexity').value;

      // Check if already exists
      const existing = state.subjects.find(s => s.name.toLowerCase() === formatted.toLowerCase());
      let targetSubjectId = null;

      if (existing) {
        showToast(`A matéria "${formatted}" já estava cadastrada!`, "ℹ️");
        targetSubjectId = existing.id;
      } else {
        const colors = [
          'from-violet-500 to-purple-600',
          'from-rose-500 to-pink-600',
          'from-blue-500 to-indigo-600',
          'from-emerald-500 to-teal-600',
          'from-amber-500 to-orange-600',
          'from-cyan-500 to-sky-600'
        ];
        targetSubjectId = 'sub-user-' + Date.now();
        state.subjects.push({
          id: targetSubjectId,
          name: formatted,
          complexity: complexity || 'Alta Complexidade',
          color: colors[state.subjects.length % colors.length]
        });

        addXP(15, 'organizacao', 'Nova matéria adicionada');
        saveState();
        showToast(`Matéria "${formatted}" adicionada! +15 XP`, "📚");
      }

      const ctx = currentAddSubjectContext;
      currentAddSubjectContext = null;

      if (ctx === 'upload-file') {
        openUploadFileModal(targetSubjectId);
      } else if (ctx === 'upload-schedule') {
        openUploadScheduleModal(targetSubjectId);
      } else if (ctx === 'add-event') {
        const subObj = state.subjects.find(s => s.id === targetSubjectId);
        openAddEventModal(subObj ? subObj.name : formatted);
      } else {
        closeModal();
        renderCurrentTab();
      }
    }

    function deleteSubjectFromList(id) {
      const sub = state.subjects.find(s => s.id === id);
      if (!sub) return;
      if (confirm(`Deseja remover a matéria "${sub.name}"?`)) {
        state.subjects = state.subjects.filter(s => s.id !== id);
        saveState();
        openAddSubjectModal(currentAddSubjectContext);
        showToast(`Matéria "${sub.name}" removida.`, "🗑️");
      }
    }

    /* ========================================================
       DESKTOP RESPONSIVE TOGGLE & CLOCK
       ======================================================== */
    let isFullDesktopView = false;

    function toggleDeviceView() {
      isFullDesktopView = !isFullDesktopView;
      const viewport = document.getElementById('app-viewport');
      const label = document.getElementById('view-mode-label');

      if (isFullDesktopView) {
        viewport.classList.remove('max-w-[420px]', 'md:rounded-[42px]', 'md:border-[10px]');
        viewport.classList.add('max-w-4xl', 'md:rounded-2xl', 'md:border-2');
        label.innerText = 'Alternar para Modo Celular';
      } else {
        viewport.classList.add('max-w-[420px]', 'md:rounded-[42px]', 'md:border-[10px]');
        viewport.classList.remove('max-w-4xl', 'md:rounded-2xl', 'md:border-2');
        label.innerText = 'Alternar para Tela Cheia';
      }
    }

    function updatePhoneClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('phone-clock');
      if (clockEl) {
        clockEl.innerText = `${hours}:${minutes}`;
      }
    }

    // Initialize Application
    document.addEventListener('DOMContentLoaded', () => {
      renderCurrentTab();
      updatePhoneClock();
      setInterval(updatePhoneClock, 30000);
    });
  </script>
</body>
</html>
